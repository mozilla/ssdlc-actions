name: SSDLC AI Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  ai-security-review:
    permissions:
      contents: read
      pull-requests: write
    # Branch ref for testing; pin to a SHA once the POC works.
    uses: mozilla/ssdlc-actions/.github/workflows/ai-security-review.yml@test-ai-scanning
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
