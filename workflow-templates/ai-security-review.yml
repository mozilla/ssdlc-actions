name: SSDLC AI Security Review

on:
  pull_request:
    # No `synchronize`: a PR is reviewed when opened, and again only when the
    # `ai-review` label is added. Create that label in your repository.
    types: [opened, reopened, ready_for_review, labeled]

permissions: {}

jobs:
  ai-security-review:
    # Only the rescan label starts a run; any other label is ignored here (the
    # gate also checks, so this only avoids a skipped run per label).
    if: github.event.action != 'labeled' || github.event.label.name == 'ai-review'
    permissions:
      contents: read
      id-token: write # Anthropic Workload Identity Federation (OIDC)
      pull-requests: write
    # Branch ref for testing; pin to a SHA once the POC works.
    uses: mozilla/ssdlc-actions/.github/workflows/ai-security-review.yml@test-ai-scanning
