name: SSDLC Code Security Analysis
description: |
  This action runs security analysis tools such as zizmor and semgrep on public repos.
  It relies on Github Advanced Security to upload scan results.

on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # reference: https://github.com/grafana/security-github-actions/blob/main/.github/workflows/self-zizmor.yaml
      - name: Check for github actions workflow files
        id: github-actions-check
        shell: bash
        run: |
          CAN_RUN_ZIZMOR=false
          SEARCH=$(find . -path "**/.github/workflows/*.yml" -o -path "**/.github/workflows/*.yaml" -o -path "**/action.yml" -o -path "**/action.yaml")
          if [ -n "$SEARCH" ]; then
              CAN_RUN_ZIZMOR=true
          fi
          echo "can-run-zizmor=${CAN_RUN_ZIZMOR}" >> $GITHUB_OUTPUT

      - name: Github actions security analysis using zizmor
        if: ${{ steps.github-actions-check.outputs.can-run-zizmor == 'true' }}
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: true
          min-severity: high
          min-confidence: high
          fail-on-no-inputs: false
