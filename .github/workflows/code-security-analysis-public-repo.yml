name: SSDLC Code Security Analysis
description: |
  This action runs security analysis tools such as zizmor and semgrep on public repos.
  It relies on Github Advanced Security to upload scan results.

on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # reference: https://github.com/grafana/security-github-actions/blob/main/.github/workflows/self-zizmor.yaml
      - name: Check for github actions workflow files
        id: github-actions-check
        shell: bash
        run: |
          CAN_RUN_ZIZMOR=false
          SEARCH=$(find . -path "**/.github/workflows/*.yml" -o -path "**/.github/workflows/*.yaml" -o -path "**/action.yml" -o -path "**/action.yaml")
          if [ -n "$SEARCH" ]; then
              CAN_RUN_ZIZMOR=true
          fi
          echo "can-run-zizmor=${CAN_RUN_ZIZMOR}" >> $GITHUB_OUTPUT

      - name: Github actions security analysis using zizmor
        if: ${{ steps.github-actions-check.outputs.can-run-zizmor == 'true' }}
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: true
          min-severity: high
          min-confidence: high
          fail-on-no-inputs: false

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep==1.168.0

      # Run Semgrep CE with the OWASP Top 10, secrets, and general security audit
      # rulesets. ERROR severity only — high-confidence, exploitable patterns.
      # `--error` is omitted here: SARIF upload publishes findings to the GHAS
      # Security tab regardless of exit status, and we don't want to block the
      # workflow run on findings (the org ruleset enforces blocking, not this job).
      - name: Run Semgrep (SARIF)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/security-audit \
            --severity ERROR \
            --sarif --output semgrep.sarif \
            --metrics=off \
            --disable-version-check \
            .

      - name: Upload Semgrep SARIF to GitHub code scanning
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
