name: SSDLC Code Security Analysis
description: |
  This action runs security analysis tools such as zizmor, semgrep and
  betterleaks (secrets detection) on public repos.
  It relies on Github Advanced Security to upload scan results.

on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # reference: https://github.com/grafana/security-github-actions/blob/main/.github/workflows/self-zizmor.yaml
      - name: Check for github actions workflow files
        id: github-actions-check
        shell: bash
        run: |
          CAN_RUN_ZIZMOR=false
          SEARCH=$(find . -path "**/.github/workflows/*.yml" -o -path "**/.github/workflows/*.yaml" -o -path "**/action.yml" -o -path "**/action.yaml")
          if [ -n "$SEARCH" ]; then
              CAN_RUN_ZIZMOR=true
          fi
          echo "can-run-zizmor=${CAN_RUN_ZIZMOR}" >> $GITHUB_OUTPUT

      - name: Github actions security analysis using zizmor
        if: ${{ steps.github-actions-check.outputs.can-run-zizmor == 'true' }}
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: true
          min-severity: high
          min-confidence: high
          fail-on-no-inputs: false

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep==1.168.0

      # Run Semgrep CE with the OWASP Top 10, secrets, and general security audit
      # rulesets. ERROR severity only — high-confidence, exploitable patterns.
      # `--error` is omitted here: SARIF upload publishes findings to the GHAS
      # Security tab regardless of exit status, and we don't want to block the
      # workflow run on findings (the org ruleset enforces blocking, not this job).
      - name: Run Semgrep (SARIF)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/security-audit \
            --severity ERROR \
            --sarif --output semgrep.sarif \
            --metrics=off \
            --disable-version-check \
            .

      - name: Upload Semgrep SARIF to GitHub code scanning
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  betterleaks:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Secrets detection. As with Semgrep, findings are published to the GHAS
      # Security tab via SARIF and the job does not block on them
      # (`fail-on-leak: false`); blocking is enforced at the org-ruleset /
      # branch-protection layer.
      #
      # `scan-mode: dir` scans the working tree. The action's default `auto`
      # selects git-history mode on push events, which needs
      # `fetch-depth: 0` and would otherwise scan a single commit on the
      # shallow clone above.
      #
      # `validation: false` disables live secret validation, which would
      # otherwise send candidate secrets to third-party provider APIs to test
      # whether they are active.
      - name: Secrets scan using betterleaks
        uses: mozmark/betterleaks-action@bf02f5e117b19e1f872094115a7192d423ec3511 # 20260908-hardening-sketches
        with:
          version: v1.8.1
          scan-mode: dir
          report-format: sarif
          report-path: betterleaks.sarif
          redact: 'true'
          validation: 'false'
          fail-on-leak: 'false'

      - name: Upload betterleaks SARIF to GitHub code scanning
        if: ${{ always() && hashFiles('betterleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks
