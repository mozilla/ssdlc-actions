name: SSDLC AI Security Review

# Reusable workflow running an AI security review on pull requests. A gate
# first applies the rules in ai-security-review/policy/default.yml and only then
# runs the Mozilla fork of anthropics/claude-code-security-review, which posts
# findings as inline PR review comments. The workflow never fails on findings;
# blocking belongs at the org-ruleset / branch-protection layer, not here.

on:
  workflow_call:
    inputs:
      claude-model:
        description: Claude model used for the review and the false-positive filter.
        type: string
        required: false
        default: claude-opus-5-5

permissions: {}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # list the PR's files and comments, post the "too big" comment, remove the rescan label
    outputs:
      scan: ${{ steps.gate.outputs.scan }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Decide whether to run an AI scan
        id: gate
        # Branch ref for testing; pin to a SHA once the POC works.
        uses: mozilla/ssdlc-actions/ai-security-review/gate@main

  review:
    name: Claude security review
    needs: gate
    if: needs.gate.outputs.scan == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # One review per PR at a time. A running review always finishes; a rescan
    # requested meanwhile waits, and only the latest waiting one runs (GitHub
    # keeps one pending job).
    concurrency:
      group: ai-security-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # request the OIDC token for Anthropic Workload Identity Federation
      pull-requests: write # inline review comments
    steps:
      - name: Record why the review runs
        env:
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          # The reason can contain file names from the PR, so show it as a code span.
          printf '### Claude security review\n\n`%s`\n' "${REASON//\`/\'}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout pull request head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      # Keyless auth: Anthropic Workload Identity Federation. The federation rule
      # trusts this workflow's job_workflow_ref, so the token proves this workflow ran.
      # Anthropic accepts each GitHub OIDC token only once (`jti_reused` otherwise), and
      # the review runs several Anthropic clients. So the token is exchanged here, once,
      # and the review step gets the short-lived Anthropic token (ANTHROPIC_AUTH_TOKEN)
      # instead of the JWT. No JWT is written to disk. That token cannot be refreshed, and
      # Anthropic caps its lifetime at twice the remaining life of the JWT (about 10 minutes).
      - name: Exchange GitHub OIDC token for an Anthropic token
        id: anthropic-auth
        env:
          # These IDs are not sensitive, so they are Actions variables, not secrets:
          # Anthropic documents them as non-secret, and the federation rule gates access.
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          jwt=$(curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          echo "::add-mask::$jwt"
          body=$(jq -n \
            --arg assertion "$jwt" \
            --arg rule "$FEDERATION_RULE_ID" \
            --arg org "$ORGANIZATION_ID" \
            --arg svac "$SERVICE_ACCOUNT_ID" \
            --arg ws "$WORKSPACE_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: $assertion, federation_rule_id: $rule,
              organization_id: $org, service_account_id: $svac}
             + (if $ws != "" then {workspace_id: $ws} else {} end)')
          # --fail hides the response body, which is an opaque 401 anyway; the reason is
          # in the authentication history in the Anthropic Console.
          response=$(curl -sS --fail https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" -d "$body")
          token=$(jq -r '.access_token // empty' <<< "$response")
          if [ -z "$token" ]; then
            echo "::error::Anthropic token exchange returned no access_token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Claude Code security review
        # Branch ref for testing; pin to a SHA once the POC works.
        uses: mozilla/claude-code-security-review@main
        env:
          # Already exchanged above; the federation IDs are deliberately not passed on.
          ANTHROPIC_AUTH_TOKEN: ${{ steps.anthropic-auth.outputs.token }}
        with:
          claude-model: ${{ inputs.claude-model }}
          comment-pr: "true"
          # The gate and the caller's triggers decide when to scan; the action's own
          # once-per-PR cache can skip a requested rescan
          # (anthropics/claude-code-security-review#120).
          run-every-commit: "true"
