name: SSDLC Code Security Analysis
description: |
  Workflow file for running code security analysis actions on private and
  internal repos. Runs zizmor (GitHub Actions security), Semgrep CE
  (application source security) and betterleaks (secrets detection). Findings
  surface as workflow annotations on the PR diff and in the job log. The job
  always passes regardless of findings; blocking is enforced at the
  org-ruleset / branch-protection layer, not here.

on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      
      # reference: https://github.com/grafana/security-github-actions/blob/main/.github/workflows/self-zizmor.yaml
      - name: Check for github actions workflow files
        id: github-actions-check
        shell: bash
        run: |
          CAN_RUN_ZIZMOR=false
          SEARCH=$(find . -path "**/.github/workflows/*.yml" -o -path "**/.github/workflows/*.yaml" -o -path "**/action.yml" -o -path "**/action.yaml")
          if [ -n "$SEARCH" ]; then
              CAN_RUN_ZIZMOR=true
          fi
          echo "can-run-zizmor=${CAN_RUN_ZIZMOR}" >> $GITHUB_OUTPUT

      - name: Github actions security analysis using zizmor
        if: ${{ steps.github-actions-check.outputs.can-run-zizmor == 'true' }}
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          annotations: true
          advanced-security: false
          min-severity: high
          min-confidence: high
          fail-on-no-inputs: false

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep==1.168.0

      # No GHAS on private repos — findings still surface as workflow
      # annotations on the diff and in the full job log. The step does NOT
      # fail the job on findings (matches the public-repo workflow's behavior).
      # Rationale: blocking belongs at the org-ruleset / branch-protection
      # layer where Security can manage exemptions, not inside the workflow.
      # `|| true` guarantees the step exits 0 even if Semgrep exits non-zero
      # on findings (default behavior with `--severity ERROR`).
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/security-audit \
            --severity ERROR \
            --metrics=off \
            --disable-version-check \
            . || true

  betterleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Secrets detection. No GHAS on private repos, so the SARIF report cannot
      # be published to the Security tab. Instead `verbose: true` prints each
      # finding's rule, line and path to the job log, with the matched value
      # shown as REDACTED (`redact: true`) so no secret material is written to
      # the log. The step does NOT fail the job on findings, matching the
      # Semgrep job above.
      #
      # `report-format: sarif` is still requested even though the report is
      # never uploaded: the action only derives a leak count from a SARIF
      # report, and without one its job summary reports "No leaks detected"
      # regardless of what was found. The file itself is discarded.
      #
      # `scan-mode: dir` scans the working tree; the default `auto` selects
      # git-history mode on push events, which needs `fetch-depth: 0` and would
      # otherwise scan a single commit on the shallow clone above.
      #
      # `validation: false` disables live secret validation, which would
      # otherwise send candidate secrets from a private repo to third-party
      # provider APIs to test whether they are active.
      - name: Secrets scan using betterleaks
        uses: mozmark/betterleaks-action@bf02f5e117b19e1f872094115a7192d423ec3511 # 20260908-hardening-sketches
        with:
          version: v1.8.1
          scan-mode: dir
          report-format: sarif
          report-path: betterleaks.sarif
          redact: 'true'
          verbose: 'true'
          validation: 'false'
          fail-on-leak: 'false'
